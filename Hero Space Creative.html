<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Creative | Desarrollo web a la medida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A2A66; --surface:#fff; --text:#F4F7FF; --muted:#B4C3E6;
  --line:rgba(255,255,255,.14); --cta:#2BD576; --cta-ink:#04210F;
  --ease:cubic-bezier(.23,1,.32,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081F4D}}
:root[data-theme="dark"]{--bg:#081F4D}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.brand{display:flex;align-items:center;gap:10px;font:600 1.05rem "Sora",sans-serif;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center}
.mark i{width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:7px -7px 0 -3px var(--cta)}
.links{display:flex;gap:32px;font-size:.95rem;color:var(--muted)}
.links a{transition:color .16s ease-out}
.links a:hover{color:#fff}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;min-height:calc(100svh - 76px);padding:24px 0 72px}
h1{font:600 clamp(2.5rem,5.4vw,4.4rem)/1.02 "Sora",sans-serif;letter-spacing:-.04em;margin:0;max-width:14ch}
.lead{font-size:1.2rem;line-height:1.55;color:var(--muted);max-width:34ch;margin:24px 0 36px}
.actions{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--cta);color:var(--cta-ink);font-weight:500;padding:15px 24px;border-radius:999px;transition:transform .16s var(--ease),filter .16s ease-out}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;fill:currentColor}
.text-link{color:var(--text);border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color .16s ease-out}
.text-link:hover{border-color:#fff}

/* maqueta del sitio */
.stage{position:relative}
.browser{background:var(--surface);border-radius:18px;box-shadow:0 40px 70px -28px rgba(0,0,0,.5);overflow:hidden}
.bar{height:42px;border-bottom:1px solid #E6EBF4;display:flex;align-items:center;justify-content:center}
.url{width:44%;height:18px;border-radius:9px;background:#EEF2F9}
.page{padding:26px;display:grid;gap:14px}
.s{height:12px;border-radius:6px;background:#E6EBF4}
.s.h{height:20px;width:62%;background:var(--bg)}
.s.w{width:84%}.s.n{width:56%}
.pill{width:116px;height:34px;border-radius:999px;background:var(--cta);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.tiles b{height:92px;border-radius:12px;background:#EAF0FF}
.tiles b:nth-child(2){background:#D5E2FF}
.tiles b:nth-child(3){background:#F1F4FA}
.chip{position:absolute;right:-14px;bottom:-22px;display:flex;align-items:center;gap:12px;background:var(--cta);color:var(--cta-ink);padding:14px 18px;border-radius:16px;font-size:.92rem;line-height:1.3;box-shadow:0 18px 36px -14px rgba(0,0,0,.5)}
.chip svg{width:22px;height:22px;fill:currentColor;flex:none}
.chip strong{font-weight:500;display:block}

/* una sola entrada al cargar */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in{animation:up .42s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}
@media (prefers-reduced-motion:reduce){.in{animation:none}.btn,.links a,.text-link{transition:none}}

@media (max-width:900px){
  .links a:not(:last-child){display:none}
  .hero{grid-template-columns:1fr;gap:48px;min-height:0;padding-top:32px}
  .chip{right:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="#"><span class="mark"><i></i></span>Space Creative</a>
    <div class="links">
      <a href="#servicios">Servicios</a>
      <a href="#nosotros">Por qué nosotros</a>
      <a href="#metodologia">Metodología</a>
      <a href="#contacto">Contacto</a>
    </div>
  </nav>

  <header class="hero">
    <div>
      <h1 class="in">Desarrollo web a la medida de tu negocio</h1>
      <p class="lead in d1">Sitios y plataformas pensados para vender y captar clientes reales.</p>
      <div class="actions in d2">
        <a class="btn" href="https://wa.me/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200Zm4.5-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.100-.6.800-.8 1-.3.200-.5.100a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.2 0-.3 0-.4l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.300 5.300 0 0 0 1.100 2.800 12 12 0 0 0 4.600 4c1.700.7 2.400.8 3.200.7.500-.1 1.500-.6 1.700-1.200s.2-1.100.2-1.200-.2-.2-.4-.3Z"/></svg>
          Cotiza tu proyecto
        </a>
        <a class="text-link" href="#servicios">Ver servicios</a>
      </div>
    </div>

    <div class="stage in d3" aria-hidden="true">
      <div class="browser">
        <div class="bar"><div class="url"></div></div>
        <div class="page">
          <div class="s h"></div><div class="s w"></div><div class="s n"></div>
          <div class="pill"></div>
          <div class="tiles"><b></b><b></b><b></b></div>
        </div>
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Z"/></svg>
        <span><strong>Nueva cotización</strong>desde tu sitio web</span>
      </div>
    </div>
  </header>
</div>
</body>
</html>
